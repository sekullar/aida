<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>AIDA</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="../assets/logo.svg" alt=""><b>AIDA</b><span class="sub">Artificial Intelligence Debate Arena</span></div>
  <div class="head-right">
    <button id="updChip" class="ext-chip upd" hidden></button>
    <span id="extChip" class="ext-chip off">Uzantı bağlı değil</span>
    <button id="btnNew" class="ghost" title="Tüm sohbetleri sıfırla">Yeni oturum</button>
    <button id="btnFx" class="icon fx-toggle" title="Animasyonları kapat" aria-label="Animasyonları kapat" aria-pressed="true">✧</button>
    <button id="btnTheme" class="icon" title="Açık temaya geç" aria-label="Açık temaya geç" aria-pressed="false">
      <svg id="themeIcon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    </button>
    <button id="btnSettings" class="icon" title="Ayarlar" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="stage" id="stage">
    <canvas id="fxCanvas" aria-hidden="true"></canvas>
    <div class="table" id="table">
      <div class="table-center" id="center"></div>
    </div>
    <div id="seats"></div>
    <div class="you-seat"><div class="you-dot"></div><span>Sen</span></div>
  </section>
  <aside class="log">
    <div class="log-head"><span>Sohbet akışı</span><span id="roundInfo" class="dim"></span></div>
    <div id="feed" class="feed"></div>
  </aside>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="2" aria-label="Masaya mesaj yaz" placeholder="Masaya bir mesaj yaz… (Enter gönderir, Shift+Enter yeni satır)"></textarea>
    <div class="actions">
      <label class="switch" title="Durdurulana kadar yapay zekalar kendi aralarında konuşur">
        <input type="checkbox" id="auto" aria-label="Otopilot"><span class="track"><span class="thumb"></span></span><span class="sw-label">Otopilot</span>
      </label>
      <button id="btnStop" class="danger" hidden>Durdur</button>
      <button id="btnSend" class="primary">Gönder</button>
    </div>
  </div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="dialog">
    <div class="dialog-head"><h2>Ayarlar</h2><button id="btnClose" class="icon" aria-label="Kapat">✕</button></div>

    <h3>Masaya davet et</h3>
    <div id="inviteList" class="invite-list"></div>

    <h3>Chrome uzantısı</h3>
    <div class="ext-box" id="extBox"></div>

    <h3>Tartışma</h3>
    <div class="grid3">
      <label>Cevap uzunluğu (kelime)<input type="number" id="setWords" min="20" max="1000"></label>
      <label>Zaman aşımı (sn)<input type="number" id="setTimeout" min="30" max="1800"></label>
      <label>Otopilot tur sınırı (0 = sınırsız)<input type="number" id="setRounds" min="0" max="500"></label>
    </div>
    <label class="chk"><input type="checkbox" id="setSave"> Geliştirici: konuşmayı sohbet.txt dosyasına kaydet</label>
    <div class="dialog-foot"><span id="verInfo" class="ver-info"></span><button id="btnSave" class="primary">Kaydet</button></div>
  </div>
</div>

<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
